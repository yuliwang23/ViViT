platform=xilinx_u280_gen3x16_xdma_1_202211_1
save-temps=1
debug=1

[connectivity]

# Current host flow:
# 1. One layernorm CU writes X_norm + scaler.
# 2. One quantized linear_qkv_multihead CU consumes X_norm + scaler and writes Q/K/V.
# 3. Twelve attention_opt CUs consume per-head sub-buffers sliced from the shared Q/K/V buffers.
#
# Because the host uses shared parent buffers plus clCreateSubBuffer() for Q/K/V and attention Out,
# the producing and consuming kernel ports for the same logical tensor must land on the same memory bank.

nk=layernorm:1
nk=linear_qkv_multihead:1
# Conservative implementation-oriented config.
# Keep the design under the HMSS port limit and reduce placer pressure.
# Port count:
#   layernorm            : 3
#   linear_qkv_multihead : 9
#   attention_opt        : 4 per CU
# With 4 attention CUs:
#   3 + 9 + 4*4 = 28
nk=attention_opt:4

# layernorm_1
# gmem0 : x + gamma
# gmem1 : beta + out(X_norm)
# gmem2 : scaler
sp=layernorm_1.m_axi_gmem0:HBM[0]
sp=layernorm_1.m_axi_gmem1:HBM[1]
sp=layernorm_1.m_axi_gmem2:HBM[2]

# linear_qkv_multihead_1
# gmem0 : X            <- must match layernorm out bank
# gmem1 : scale_input  <- must match layernorm scaler bank
# gmem2 : Wq
# gmem3 : Wk
# gmem4 : Wv
# gmem5 : bq/bk/bv/scale_wq/scale_wk/scale_wv
# gmem6 : Q            <- must match all attention Q banks
# gmem7 : K            <- must match all attention K banks
# gmem8 : V            <- must match all attention V banks
sp=linear_qkv_multihead_1.m_axi_gmem0:HBM[1]
sp=linear_qkv_multihead_1.m_axi_gmem1:HBM[2]
sp=linear_qkv_multihead_1.m_axi_gmem2:HBM[3]
sp=linear_qkv_multihead_1.m_axi_gmem3:HBM[4]
sp=linear_qkv_multihead_1.m_axi_gmem4:HBM[5]
sp=linear_qkv_multihead_1.m_axi_gmem5:HBM[6]
sp=linear_qkv_multihead_1.m_axi_gmem6:HBM[7]
sp=linear_qkv_multihead_1.m_axi_gmem7:HBM[8]
sp=linear_qkv_multihead_1.m_axi_gmem8:HBM[9]

# attention_opt_[1..4]
# All head CUs share the same parent Q/K/V/Out buffers, so each corresponding port
# is pinned to the same bank across all CUs.
sp=attention_opt_1.m_axi_attention_gmem0:HBM[7]
sp=attention_opt_1.m_axi_attention_gmem1:HBM[8]
sp=attention_opt_1.m_axi_attention_gmem2:HBM[9]
sp=attention_opt_1.m_axi_attention_gmem3:HBM[10]
sp=attention_opt_2.m_axi_attention_gmem0:HBM[7]
sp=attention_opt_2.m_axi_attention_gmem1:HBM[8]
sp=attention_opt_2.m_axi_attention_gmem2:HBM[9]
sp=attention_opt_2.m_axi_attention_gmem3:HBM[10]
sp=attention_opt_3.m_axi_attention_gmem0:HBM[7]
sp=attention_opt_3.m_axi_attention_gmem1:HBM[8]
sp=attention_opt_3.m_axi_attention_gmem2:HBM[9]
sp=attention_opt_3.m_axi_attention_gmem3:HBM[10]
sp=attention_opt_4.m_axi_attention_gmem0:HBM[7]
sp=attention_opt_4.m_axi_attention_gmem1:HBM[8]
sp=attention_opt_4.m_axi_attention_gmem2:HBM[9]
sp=attention_opt_4.m_axi_attention_gmem3:HBM[10]

[profile]
# Compromise profile config: keep only one representative output monitor.
data=attention_opt:attention_opt_1:Out:all
